<body>
    <div class="form-container">
        <div class="back"><img src="/images/back-icon yellow.png" alt=""> <button><a href="/landing-page/index.html">back</a>
            </button></div>
        <div class="form">

            <form id="" action="">
                <h3 style="font-size: 23px;">signin</h3>
                <label for="name">Name</label>
                <div id="input"><input type="text" id="name" name="name" placeholder="enter your name" required> </div>

                <label for="name">Email address</label>
                <div id="input"><input type="text" id="name" name="name" placeholder="Email address" required>
                </div>

                <label for="name">Choose password</label>
                <div id="input"><input type="password" id="name" name="name" placeholder="password" required>

                <label for="name">confirm password </label>
                <div id="input"><input type="password" id="name" name="name" placeholder="confirm password" required>
                </div>
                <div class="sign-btn">

                        <button>sign up with google</button>

                    </div>
                    <img src="/images/google-icon.png" alt="" width="20px" height="20px" style="margin-top: 2px ;">
                </div>

                <button id="done">sign up</button>

            </form>

        </div>

                font-family:playfair;
